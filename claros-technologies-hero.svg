<svg viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" fill="#8b9bbd" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#f4f5f7"/>
  <rect width="800" height="200" fill="url(#dots)"/>
  <rect x="0" y="0" width="380" height="200" fill="rgba(91,141,239,0.04)"/>

  <!-- Molecular chain — larger, fills right half -->
  <!-- Bonds upper -->
  <line x1="420" y1="100" x2="480" y2="55"  stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="480" y1="55"  x2="560" y2="75"  stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="560" y1="75"  x2="620" y2="30"  stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="620" y1="30"  x2="710" y2="58"  stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="710" y1="58"  x2="770" y2="28"  stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <!-- Bonds lower -->
  <line x1="420" y1="100" x2="480" y2="145" stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="480" y1="145" x2="560" y2="125" stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="560" y1="125" x2="620" y2="170" stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="620" y1="170" x2="710" y2="142" stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <line x1="710" y1="142" x2="770" y2="172" stroke="#b0bdd8" stroke-width="2" opacity="0.7"/>
  <!-- Verticals -->
  <line x1="560" y1="75"  x2="560" y2="125" stroke="#b0bdd8" stroke-width="2" opacity="0.6"/>
  <line x1="710" y1="58"  x2="710" y2="142" stroke="#b0bdd8" stroke-width="2" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="420" cy="100" r="10" fill="#5b8def" opacity="0.95" filter="url(#glow)"/>
  <circle cx="480" cy="55"  r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="560" cy="75"  r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="620" cy="30"  r="6"  fill="#a3b4d1" opacity="0.7"/>
  <circle cx="710" cy="58"  r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="770" cy="28"  r="5"  fill="#a3b4d1" opacity="0.6"/>
  <circle cx="480" cy="145" r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="560" cy="125" r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="620" cy="170" r="6"  fill="#a3b4d1" opacity="0.7"/>
  <circle cx="710" cy="142" r="7"  fill="#8b9bbd" opacity="0.8"/>
  <circle cx="770" cy="172" r="5"  fill="#a3b4d1" opacity="0.6"/>

  <!-- Atom labels -->
  <text x="480" y="52"  font-family="Arial,sans-serif" font-size="9"  font-weight="700" fill="#6b7ea0" text-anchor="middle">F</text>
  <text x="560" y="72"  font-family="Arial,sans-serif" font-size="9"  font-weight="700" fill="#6b7ea0" text-anchor="middle">C</text>
  <text x="620" y="27"  font-family="Arial,sans-serif" font-size="9"  font-weight="700" fill="#6b7ea0" text-anchor="middle">F</text>
  <text x="710" y="55"  font-family="Arial,sans-serif" font-size="9"  font-weight="700" fill="#6b7ea0" text-anchor="middle">C</text>
  <text x="770" y="25"  font-family="Arial,sans-serif" font-size="9"  font-weight="700" fill="#6b7ea0" text-anchor="middle">F</text>

  <!-- Destruction X marks -->
  <line x1="648" y1="20"  x2="664" y2="36"  stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  <line x1="664" y1="20"  x2="648" y2="36"  stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  <line x1="748" y1="18"  x2="764" y2="34"  stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  <line x1="764" y1="18"  x2="748" y2="34"  stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  <line x1="748" y1="162" x2="764" y2="178" stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  <line x1="764" y1="162" x2="748" y2="178" stroke="#ef4444" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>

  <!-- Left: wordmark — much larger -->
  <text x="36" y="96"  font-family="Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-2" fill="#1a2640">CLAROS</text>
  <text x="38" y="126" font-family="Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="5"  fill="#4a5e82">TECHNOLOGIES</text>

  <!-- Divider line -->
  <line x1="36" y1="136" x2="370" y2="136" stroke="#c5cfe8" stroke-width="0.8" opacity="0.7"/>

  <!-- Tag -->
  <text x="36" y="156" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#5b8def">PFAS DESTRUCTION · SERIES B · $55M</text>

  <!-- Bottom label -->
  <text x="400" y="190" font-family="Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#8b9bbd" text-anchor="middle">$55M FINANCING · MINNEAPOLIS, MN · 2026</text>
</svg>
