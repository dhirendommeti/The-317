  </defs>

  <rect width="800" height="200" fill="#f4f5f7"/>
  <rect width="800" height="200" fill="url(#dots)"/>

  <!-- ── LEFT: Church's ── -->
  <rect x="52" y="72" width="52" height="52" fill="#e8421a" rx="3"/>
  <text x="78" y="107" font-family="Arial Black,Arial,sans-serif" font-size="27" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>

  <text x="116" y="93"  font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5" fill="#1a1a1a">Church's</text>
