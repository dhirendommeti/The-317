<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
      <rect width="720" height="340" fill="#0f1623"/>
      <defs>
        <pattern id="grid-il" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0L0 0 0 50" fill="none" stroke="#1a2640" stroke-width="1"/>
        </pattern>
        <marker id="arr5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#5b8def"/>
        </marker>
      </defs>
      <rect width="720" height="340" fill="url(#grid-il)"/>

      <!-- Acquirer card (Pontiac) -->
      <rect x="40" y="50" width="220" height="230" rx="8" fill="#131d2e" stroke="#1f2c47" stroke-width="1.5"/>
      <rect x="40" y="50" width="220" height="4" rx="2" fill="#5b8def"/>
      <text x="150" y="84" text-anchor="middle" fill="#5b8def" font-family="Inter,sans-serif" font-size="9" letter-spacing="0.14em" font-weight="700">ACQUIRER · ILLINOIS</text>
      <text x="150" y="112" text-anchor="middle" fill="#edf1fa" font-family="DM Serif Display,Georgia,serif" font-size="19">Pontiac Bancorp</text>
      <text x="150" y="132" text-anchor="middle" fill="#8b9bbd" font-family="JetBrains Mono,monospace" font-size="10">Pontiac, IL · Livingston Co.</text>
      <line x1="65" y1="148" x2="235" y2="148" stroke="#1f2c47" stroke-width="1"/>
      <text x="150" y="168" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="10">Acquires westward along I-80</text>
      <text x="150" y="196" text-anchor="middle" fill="#edf1fa" font-family="JetBrains Mono,monospace" font-size="14" font-weight="500">$45.5M</text>
      <text x="150" y="214" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="10">All-cash offer</text>
      <text x="150" y="232" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="10">$22.50 per share</text>
      <text x="150" y="254" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="9">Expected close Q4 2026</text>

      <!-- I-80 corridor visual (center) -->
      <line x1="280" y1="165" x2="440" y2="165" stroke="#5b8def" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.5"/>
      <text x="360" y="152" text-anchor="middle" fill="#5b8def" font-family="Inter,sans-serif" font-size="9" font-weight="700" letter-spacing="0.1em">I-80 CORRIDOR</text>
      <!-- Arrow pointing left (acquiring Ottawa, west of Pontiac) -->
      <line x1="380" y1="165" x2="302" y2="165" stroke="#5b8def" stroke-width="2" marker-end="url(#arr5)"/>
      <text x="360" y="183" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="8">~45 miles</text>

      <!-- Target card (Ottawa) -->
      <rect x="460" y="50" width="220" height="230" rx="8" fill="#131d2e" stroke="#1f2c47" stroke-width="1.5"/>
      <rect x="460" y="50" width="220" height="4" rx="2" fill="#82aef2"/>
      <text x="570" y="84" text-anchor="middle" fill="#82aef2" font-family="Inter,sans-serif" font-size="9" letter-spacing="0.14em" font-weight="700">TARGET · ILLINOIS</text>
      <text x="570" y="112" text-anchor="middle" fill="#edf1fa" font-family="DM Serif Display,Georgia,serif" font-size="19">Ottawa Bancorp</text>
      <text x="570" y="132" text-anchor="middle" fill="#8b9bbd" font-family="JetBrains Mono,monospace" font-size="10">Ottawa, IL · LaSalle Co.</text>
      <line x1="485" y1="148" x2="655" y2="148" stroke="#1f2c47" stroke-width="1"/>
      <text x="570" y="168" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="10">Ottawa Savings Bank</text>
      <text x="570" y="196" text-anchor="middle" fill="#edf1fa" font-family="Inter,sans-serif" font-size="12" font-weight="600">Residential mortgage</text>
      <text x="570" y="214" text-anchor="middle" fill="#edf1fa" font-family="Inter,sans-serif" font-size="12" font-weight="600">Retail deposits</text>
      <text x="570" y="236" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="9">Illinois River market</text>
      <text x="570" y="254" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="9">Mutual-to-stock conversion legacy</text>

      <!-- Bottom bar -->
      <rect x="40" y="298" width="640" height="28" rx="4" fill="#1a2640" stroke="#2c3c5e"/>
      <text x="360" y="317" text-anchor="middle" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="10" letter-spacing="0.08em">ILLINOIS COMMUNITY BANK CONSOLIDATION · $45.5M ALL CASH · AUG 2026</text>
