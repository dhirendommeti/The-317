  <circle cx="278" cy="67" r="7" fill="#0f1623" stroke="#5b8def" stroke-width="2"/>
  <circle cx="278" cy="67" r="3" fill="#5b8def"/>

  <!-- City dot: Bourbonnais / Kankakee Co. (Illinois State Bancorp) -->
  <circle cx="276" cy="110" r="6" fill="#0f1623" stroke="#82aef2" stroke-width="1.5"/>
  <circle cx="276" cy="110" r="2.5" fill="#82aef2"/>

  <!-- Labels left of dots -->
  <text x="264" y="62" text-anchor="end" fill="#edf1fa" font-family="Inter,sans-serif" font-size="10" font-weight="600">N. Chicago suburbs</text>
  <text x="264" y="75" text-anchor="end" fill="#5b8def" font-family="Inter,sans-serif" font-size="9" letter-spacing="0.04em">BYLINE BANCORP</text>

  <text x="262" y="106" text-anchor="end" fill="#edf1fa" font-family="Inter,sans-serif" font-size="10" font-weight="600">Bourbonnais</text>
  <text x="262" y="119" text-anchor="end" fill="#82aef2" font-family="Inter,sans-serif" font-size="9" letter-spacing="0.04em">ILLINOIS STATE BANCORP</text>

