<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="340" fill="#0f1623"/>
  <defs>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#82aef2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#82aef2" stop-opacity="0"/>
