  <text x="364" y="82" fill="#edf1fa" font-family="Libre Baskerville,Georgia,serif" font-size="21">Byline Bancorp</text>
  <text x="364" y="104" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="13" font-style="italic">acquires</text>
  <text x="364" y="134" fill="#edf1fa" font-family="Libre Baskerville,Georgia,serif" font-size="17">Illinois State Bancorp</text>

  <line x1="364" y1="152" x2="706" y2="152" stroke="#1f2c47" stroke-width="1"/>

  <text x="364" y="204" fill="#edf1fa" font-family="JetBrains Mono,monospace" font-size="50" font-weight="500">$87.9M</text>
  <text x="364" y="225" fill="#8b9bbd" font-family="Inter,sans-serif" font-size="12">Cash + stock · $261.23 per share</text>

