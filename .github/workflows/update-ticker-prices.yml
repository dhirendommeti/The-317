name: Update ticker fallback prices

on:
  schedule:
    # 9:35 AM ET on weekdays (market open + 5 min for quotes to settle)
    - cron: '35 13 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch quotes and patch ticker.js
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node scripts/update-ticker-prices.js

      - name: Commit and push if prices changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/dhirendommeti/The-317.git
          git diff --quiet ticker.js || (
            git add ticker.js &&
            git commit -m "chore: refresh ticker fallback prices [skip ci]" &&
            git push origin main
          )
